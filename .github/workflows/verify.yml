name: Verify Studio

on:
  pull_request:
  push:
    branches: [main, feat/remediation-program, release/january-2027]

concurrency:
  group: studio-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm remediation:check
      - run: pnpm recovery:drill
      - run: pnpm typecheck
      # All triggers need the same reviewed compatible App fixture runtime.
      - name: Checkout paired App contracts
        uses: actions/checkout@v4
        with:
          repository: ethanmcn2013-droid/app
          ref: 182935f76b88398fae073f5f0f4e8ebbfb7353d2
          path: app-contract-peer
      - name: Install immutable paired App dependencies
        working-directory: app-contract-peer
        run: corepack pnpm install --frozen-lockfile
      - name: Record paired App revision and compare contracts
        run: |
          git -C app-contract-peer rev-parse HEAD
          pnpm contracts:check
          node --test scripts/check-suite-contract-consumers.test.mjs
        env:
          APP_REPO_PATH: ${{ github.workspace }}/app-contract-peer
      - name: Test
        run: pnpm test
        env:
          APP_REPO_PATH: ${{ github.workspace }}/app-contract-peer
          VENUE_APP_FIXTURE_ROOT: ${{ github.workspace }}/app-contract-peer
      - name: Remove paired checkout before scanning or building Studio
        if: always()
        run: rm -rf app-contract-peer
      - run: pnpm build
